name: campus-parking-simulation

x-backend-environment: &backend-environment
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-campus_app}:${POSTGRES_PASSWORD:-campus_dev_password}@database:5432/${POSTGRES_DB:-campus_simulation}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-campus_app}:${RABBITMQ_PASSWORD:-campus_dev_password}@rabbitmq:5672/%2F
  OBJECT_STORAGE_ENDPOINT: minio:9000
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_APP_USER:-campus_app}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_APP_PASSWORD:-campus_minio_dev_password}
  OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-campus-simulation}
  OBJECT_STORAGE_SECURE: "false"
  OBJECT_STORAGE_PREFIX: models
  REFERENCE_DATA_BUCKET: ${MINIO_REFERENCE_BUCKET:-campus-reference-data}
  REFERENCE_DATA_PREFIX: raw
  SIMULATION_WORKER_CONCURRENCY: ${SIMULATION_WORKER_CONCURRENCY:-2}
  MODEL_STORAGE_DIR: /tmp/campus-simulation/models

x-backend-dependencies: &backend-dependencies
  database:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_simulation}
      POSTGRES_USER: ${POSTGRES_USER:-campus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campus_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-campus_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: campus-parking-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campus_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campus_minio_admin_password}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campus_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campus_minio_admin_password}
      MINIO_APP_USER: ${MINIO_APP_USER:-campus_app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:-campus_minio_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-campus-simulation}
      MINIO_REFERENCE_BUCKET: ${MINIO_REFERENCE_BUCKET:-campus-reference-data}
    volumes:
      - ./infrastructure/minio:/config:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    image: campus-parking-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["uvicorn", "services.api.main:app", "--app-dir", "backend", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    env_file:
      - backend/.env
    environment: *backend-environment
    depends_on: *backend-dependencies
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  simulation-worker:
    image: campus-parking-simulation-worker:local
    build:
      context: .
      dockerfile: Dockerfile
      target: simulation-worker
    command: ["python3", "-m", "services.simulation_worker.main"]
    working_dir: /app/backend
    env_file:
      - backend/.env
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    healthcheck:
      test: ["CMD", "python3", "-m", "services.simulation_worker.main", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 120s
    deploy:
      replicas: ${SIMULATION_WORKER_CONCURRENCY:-2}

  analytics-worker:
    image: campus-parking-analytics-worker:local
    build:
      context: .
      dockerfile: Dockerfile
      target: analytics-worker
    command: ["python3", "-m", "services.analytics_worker.main"]
    working_dir: /app/backend
    env_file:
      - backend/.env
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    healthcheck:
      test: ["CMD", "python3", "-m", "services.analytics_worker.main", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  gateway:
    image: campus-parking-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_DEFAULT_LAT: ${VITE_DEFAULT_LAT:-50.6110}
        VITE_DEFAULT_LNG: ${VITE_DEFAULT_LNG:-3.1420}
        VITE_DEFAULT_ZOOM: ${VITE_DEFAULT_ZOOM:-15}
        VITE_MODEL_STORAGE: server
    ports:
      - "${APP_PORT:-8000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  rabbitmq_data:
